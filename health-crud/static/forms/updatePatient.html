<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Paciente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/updatePatient.style.css">
</head>
<body>
    <div class="background-decor decor-1"></div>
    <div class="container fade-in">
        <div class="header">
            <h2>✏️ Atualizar Paciente</h2>
            <p>Insira o CPF do paciente que deseja atualizar e forneça os novos dados.</p>
        </div>
        <form action="/update" method="POST">
            <div class="form-grid">
                <div class="form-group full-width" style="margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1.5rem;">
                    <label for="cpf" style="color: var(--primary-color);">CPF do Paciente a ser atualizado</label>
                    <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>
                </div>
                
                <div class="form-group full-width">
                    <label for="name">Novo Nome Completo</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="birth_date">Nova Data de Nascimento</label>
                    <input type="date" id="birth_date" name="birth_date" required>
                </div>
                <div class="form-group">
                    <label for="blood_type">Novo Tipo Sanguíneo</label>
                    <select id="blood_type" name="blood_type" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="A+">A+</option><option value="A-">A-</option>
                        <option value="B+">B+</option><option value="B-">B-</option>
                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        <option value="O+">O+</option><option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="phone">Novo Telefone</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group full-width">
                    <label for="email">Novo E-mail</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group full-width">
                    <label for="medical_notes">Novas Anotações Médicas</label>
                    <textarea id="medical_notes" name="medical_notes" rows="4"></textarea>
                </div>
            </div>
            <div class="actions">
                <a href="/" class="btn btn-secondary">← Voltar</a>
                <button type="submit" class="btn btn-primary">Atualizar Paciente</button>
            </div>
        </form>
    </div>
</body>
</html>
