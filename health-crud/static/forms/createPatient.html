<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Paciente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/createPatient.style.css">
</head>
<body>
    <div class="background-decor decor-1"></div>
    <div class="container fade-in">
        <div class="header">
            <h2>➕ Cadastrar Paciente</h2>
            <p>Preencha os dados abaixo para adicionar um novo paciente.</p>
        </div>
        <form action="/create" method="POST">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" name="name" placeholder="Ex: João da Silva" required>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF (Somente números)</label>
                    <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>
                </div>
                <div class="form-group">
                    <label for="birth_date">Data de Nascimento</label>
                    <input type="date" id="birth_date" name="birth_date" required>
                </div>
                <div class="form-group">
                    <label for="blood_type">Tipo Sanguíneo</label>
                    <select id="blood_type" name="blood_type" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="A+">A+</option><option value="A-">A-</option>
                        <option value="B+">B+</option><option value="B-">B-</option>
                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        <option value="O+">O+</option><option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="phone">Telefone</label>
                    <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000">
                </div>
                <div class="form-group full-width">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="email@exemplo.com">
                </div>
                <div class="form-group full-width">
                    <label for="medical_notes">Anotações Médicas</label>
                    <textarea id="medical_notes" name="medical_notes" rows="4" placeholder="Observações importantes..."></textarea>
                </div>
            </div>
            <div class="actions">
                <a href="/" class="btn btn-secondary">← Voltar</a>
                <button type="submit" class="btn btn-primary">Salvar Paciente</button>
            </div>
        </form>
    </div>
</body>
</html>
