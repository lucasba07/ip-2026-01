<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Paciente</title>
  <link rel="stylesheet" href="/styles/createPatient.style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-block">
      <span class="brand-icon">✚</span>
      <div>
        <p class="brand-name">HealthCare CRUD</p>
        <p class="brand-label">Sistema de Gestão de Pacientes</p>
      </div>
    </div>
    <p class="header-note">Sistema de Gestão de Pacientes</p>
  </header>

  <main class="page-shell">
    <section class="card-page">
      <div class="card-title">
        <h1>➕ Cadastrar Paciente</h1>
        <p>Preencha os dados abaixo para adicionar um novo paciente.</p>
      </div>
      <hr />

      <form action="/create" method="POST">
        <div class="form-grid">
          <div class="form-group full-width">
            <label for="name">Nome Completo</label>
            <input type="text" id="name" name="name" placeholder="Ex: João da Silva" required>
          </div>
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" maxlength="14" minlength="14" inputmode="numeric" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Digite no formato 000.000.000-00" placeholder="000.000.000-00" required>
          </div>
          <div class="form-group">
            <label for="birth_date">Data de Nascimento</label>
            <input type="date" id="birth_date" name="birth_date" required>
          </div>
          <div class="form-group">
            <label for="blood_type">Tipo Sanguíneo</label>
            <select id="blood_type" name="blood_type" required>
              <option value="" disabled selected>Selecione</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
          <div class="form-group">
            <label for="phone">Telefone</label>
            <input type="tel" id="phone" name="phone" maxlength="14" minlength="14" inputmode="numeric" pattern="\(\d{2}\)\d{5}-\d{4}" title="Digite no formato (11)98765-4321" placeholder="(11)98765-4321">
          </div>
          <div class="form-group full-width">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="email@exemplo.com">
          </div>
          <div class="form-group full-width">
            <label for="medical_notes">Anotações Médicas</label>
            <textarea id="medical_notes" name="medical_notes" rows="4" placeholder="Observações importantes..."></textarea>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Salvar Paciente</button>
        <a href="/" class="back-link">← Voltar ao início</a>
      </form>
    </section>
  </main>

  <footer class="app-footer">© 2025 HealthCare CRUD · Projeto Acadêmico</footer>

  <script>
    function formatCPF(value) {
      const digits = value.replace(/\D/g, '').slice(0, 11);
      let formatted = digits;
      if (digits.length > 9) {
        formatted = digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
      } else if (digits.length > 6) {
        formatted = digits.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      } else if (digits.length > 3) {
        formatted = digits.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      }
      return formatted;
    }

    function formatPhone(value) {
      const digits = value.replace(/\D/g, '').slice(0, 11);
      let formatted = digits;
      if (digits.length > 7) {
        formatted = digits.replace(/(\d{2})(\d{5})(\d{1,4})/, '($1)$2-$3');
      } else if (digits.length > 2) {
        formatted = digits.replace(/(\d{2})(\d{1,5})/, '($1)$2');
      }
      return formatted;
    }

    document.getElementById('cpf').addEventListener('input', function (event) {
      event.target.value = formatCPF(event.target.value);
    });
    document.getElementById('phone').addEventListener('input', function (event) {
      event.target.value = formatPhone(event.target.value);
    });
  </script>
</body>
</html>
